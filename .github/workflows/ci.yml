name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # .env is a declared asset but gitignored — placeholder keeps asset validation happy
      - run: |
          echo "SUPABASE_URL=" > .env
          echo "SUPABASE_ANON_KEY=" >> .env
      - run: flutter pub get
      - run: flutter analyze --fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          echo "SUPABASE_URL=" > .env
          echo "SUPABASE_ANON_KEY=" >> .env
      - run: flutter pub get
      - run: flutter test
