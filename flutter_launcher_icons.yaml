# Warm Editorial app icon (docs/design/icon-splash.md).
# Regenerate after replacing assets/icon.png: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  adaptive_icon_background: "#FAF6F1"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 23
  ios: true
  remove_alpha_ios: true
